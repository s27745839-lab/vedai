<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VedAI</title>
<meta name="theme-color" content="#faf9f5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%231f1e1d'/%3E%3Cpath d='M50 46 26 86h14l10-18 10 18h14z' fill='%23faf9f5'/%3E%3Cpath d='M38 40a17 17 0 0 1 24 0M30 32a28 28 0 0 1 40 0' stroke='%23faf9f5' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  --bg:#faf9f5; --side:#f3f2ec; --card:#ffffff; --hover:#ebe9e1; --active:#e6e3d8;
  --text:#1f1e1d; --soft:#3d3c38; --muted:#7a786f; --border:#e3e0d5; --border2:#d6d2c4;
  --bubble:#efede5; --lemon:#f4efc1; --lemon-ink:#5d5420; --ink:#1f1e1d; --ink-text:#faf9f5;
  --code:#f1efe8; --shadow:0 1px 2px rgba(31,30,29,.04), 0 4px 18px rgba(31,30,29,.06);
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-theme="dark"] {
  --bg:#262624; --side:#1f1e1d; --card:#30302e; --hover:#2f2e2b; --active:#383733;
  --text:#f2f0e8; --soft:#dedbd0; --muted:#a19f95; --border:#3a3935; --border2:#4a4844;
  --bubble:#141413; --lemon:#4a4521; --lemon-ink:#f1e9a8; --ink:#f2f0e8; --ink-text:#1f1e1d;
  --code:#1c1b1a; --shadow:0 1px 2px rgba(0,0,0,.2), 0 6px 20px rgba(0,0,0,.25);
}
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; display:flex; background:var(--bg); color:var(--text); font:15px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased; overflow:hidden; }
button { font:inherit; color:inherit; cursor:pointer; background:none; border:0; }
svg { width:18px; height:18px; flex:none; }
:focus-visible { outline:2px solid #c9b94a; outline-offset:2px; border-radius:8px; }
* { scrollbar-width:thin; scrollbar-color:var(--border2) transparent; }
.icon-btn { width:34px; height:34px; display:grid; place-items:center; border-radius:8px; color:var(--muted); transition:background .15s, color .15s; }
.icon-btn:hover { background:var(--hover); color:var(--text); }

/* Logo */
.mark { width:28px; height:28px; border-radius:8px; background:var(--ink); color:var(--ink-text); display:grid; place-items:center; flex:none; }
.mark svg { width:72%; height:72%; }

/* Sidebar */
aside { width:264px; flex:none; background:var(--side); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:10px 8px; transition:margin .25s ease; }
body.collapsed aside { margin-left:-264px; }
.side-top { display:flex; align-items:center; justify-content:space-between; padding:4px 6px 14px; }
.brand { display:flex; align-items:center; gap:10px; font:600 17px/1 var(--serif); letter-spacing:-.1px; }
.nav-btn { display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border-radius:8px; font-weight:500; font-size:14px; text-align:left; transition:background .15s; }
.nav-btn:hover { background:var(--hover); }
.nav-btn .plus { width:22px; height:22px; border-radius:50%; background:var(--lemon); color:var(--lemon-ink); display:grid; place-items:center; }
.nav-btn .plus svg { width:14px; height:14px; }
.label { font-size:12px; color:var(--muted); font-weight:500; padding:20px 10px 6px; }
#chats { flex:1; overflow-y:auto; }
.chat { display:flex; align-items:center; border-radius:8px; padding:0 4px 0 10px; height:34px; cursor:pointer; color:var(--soft); transition:background .15s; }
.chat:hover { background:var(--hover); }
.chat.active { background:var(--active); color:var(--text); }
.chat span { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:13.5px; }
.chat .icon-btn { width:26px; height:26px; opacity:0; }
.chat:hover .icon-btn, .chat.active .icon-btn { opacity:1; }
.chat .icon-btn svg { width:14px; height:14px; }
.empty-list { color:var(--muted); font-size:13px; padding:2px 10px; }
.side-foot { border-top:1px solid var(--border); margin:0 -8px; padding:12px 16px 2px; font-size:12px; color:var(--muted); line-height:1.4; }
.side-foot b { display:block; color:var(--soft); font-weight:500; font-size:13px; }

/* Main */
main { flex:1; min-width:0; display:flex; flex-direction:column; position:relative; }
header { height:54px; flex:none; display:flex; align-items:center; gap:4px; padding:0 12px; }
.title { font:500 15px/1 var(--sans); color:var(--soft); padding:0 8px; }
#openSide { display:none; }
body.collapsed #openSide { display:grid; }
.spacer { flex:1; }
#scroll { flex:1; overflow-y:auto; }
#thread { max-width:740px; margin:0 auto; padding:8px 24px 40px; }

/* Messages */
.row { margin:0 0 28px; animation:in .25s ease; }
@keyframes in { from { opacity:0; transform:translateY(4px); } }
.row.user { display:flex; justify-content:flex-end; }
.bubble { background:var(--bubble); border-radius:14px; padding:9px 16px; max-width:80%; white-space:pre-wrap; overflow-wrap:anywhere; font-size:15px; }
.row.bot { display:flex; gap:14px; }
.row.bot .mark { margin-top:3px; width:26px; height:26px; border-radius:7px; }
.row.bot .body { flex:1; min-width:0; }
.actions { display:flex; gap:2px; margin:6px 0 0 -8px; opacity:0; transition:opacity .15s; }
.row.bot:hover .actions, .row.bot:last-child .actions { opacity:1; }
.row.pending .actions { display:none; }
.actions .icon-btn { width:30px; height:30px; }
.actions svg { width:15px; height:15px; }

/* Answer typography */
.md { font:16.5px/1.7 var(--serif); color:var(--text); }
.md > :first-child { margin-top:0; }
.md > :last-child { margin-bottom:0; }
.md p, .md ul, .md ol { margin:0 0 14px; }
.md ul, .md ol { padding-left:24px; }
.md li { margin:5px 0; }
.md h1, .md h2, .md h3 { font-family:var(--serif); font-weight:600; line-height:1.3; margin:22px 0 10px; }
.md h1 { font-size:22px; } .md h2 { font-size:19px; } .md h3 { font-size:17px; }
.md a { color:inherit; text-decoration:underline; text-decoration-color:var(--border2); text-underline-offset:3px; }
.md a:hover { text-decoration-color:var(--text); }
.md strong { font-weight:600; }
.md code { font:13.5px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; background:var(--code); border:1px solid var(--border); padding:1px 5px; border-radius:5px; }
.md pre { background:var(--code); border:1px solid var(--border); border-radius:10px; padding:14px 16px; overflow-x:auto; }
.md pre code { background:none; border:0; padding:0; }
.md table { border-collapse:collapse; margin:0 0 14px; display:block; overflow-x:auto; font:14px/1.5 var(--sans); }
.md th, .md td { border-bottom:1px solid var(--border); padding:8px 14px 8px 0; text-align:left; }
.md th { font-weight:600; color:var(--soft); }
.md blockquote { margin:0 0 14px; padding-left:14px; border-left:3px solid var(--lemon); color:var(--soft); }
.md hr { border:0; border-top:1px solid var(--border); margin:22px 0; }
.thinking { display:flex; align-items:center; gap:10px; color:var(--muted); font:14px var(--sans); padding:3px 0; }
.thinking i { width:14px; height:14px; border-radius:50%; border:2px solid var(--border2); border-top-color:var(--text); animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Empty state */
#hero { display:none; text-align:center; padding:0 24px 28px; }
#hero .mark { width:44px; height:44px; border-radius:12px; margin:0 auto 18px; }
#hero h1 { font:400 clamp(28px,4.4vw,40px)/1.2 var(--serif); letter-spacing:-.4px; margin:0; color:var(--text); }
#hero p { color:var(--muted); margin:10px 0 0; font-size:15px; }
main.empty { justify-content:center; }
main.empty header { position:absolute; top:0; left:0; right:0; }
main.empty #scroll { display:none; }
main.empty #hero { display:block; }
main.empty #suggest { display:flex; }

/* Composer */
.composer-wrap { padding:0 24px 6px; flex:none; }
form { max-width:740px; margin:0 auto; background:var(--card); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow);
  padding:12px 12px 10px 16px; transition:border-color .15s, box-shadow .15s; }
form:focus-within { border-color:var(--border2); box-shadow:0 1px 2px rgba(31,30,29,.05), 0 8px 28px rgba(31,30,29,.09); }
textarea { width:100%; resize:none; border:0; outline:0; background:none; color:var(--text); font:15.5px/1.55 var(--sans); padding:2px 0; max-height:220px; display:block; }
textarea::placeholder { color:var(--muted); }
textarea:focus-visible { outline:none; }
.bar { display:flex; align-items:center; gap:8px; margin-top:8px; }
.chip { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--lemon-ink); background:var(--lemon); padding:4px 10px; border-radius:20px; font-weight:500; }
.chip svg { width:13px; height:13px; }
#send { width:34px; height:34px; border-radius:10px; background:var(--ink); color:var(--ink-text); display:grid; place-items:center; transition:opacity .15s, transform .1s; margin-left:auto; }
#send:active { transform:scale(.95); }
#send:disabled { opacity:.25; cursor:default; }
#send svg { width:16px; height:16px; }

#suggest { display:none; flex-wrap:wrap; justify-content:center; gap:8px; max-width:740px; margin:16px auto 0; padding:0 24px; }
#suggest button { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--border); background:var(--bg); border-radius:10px;
  padding:7px 13px; font-size:13.5px; color:var(--soft); transition:background .15s, border-color .15s; }
#suggest button:hover { background:var(--card); border-color:var(--border2); color:var(--text); }
#suggest svg { width:15px; height:15px; color:var(--muted); }
.disclaimer { text-align:center; font-size:12px; color:var(--muted); padding:8px 16px 12px; }
main.empty .disclaimer { position:absolute; bottom:0; left:0; right:0; }

#backdrop { display:none; }
@media (max-width:768px) {
  aside { position:fixed; inset:0 auto 0 0; z-index:20; margin-left:-264px; box-shadow:var(--shadow); }
  body.open aside { margin-left:0; }
  body.open #backdrop { display:block; position:fixed; inset:0; background:rgba(20,20,19,.35); z-index:15; }
  #openSide { display:grid !important; }
  #closeSide { display:none; }
  #thread { padding:6px 16px 24px; }
  .composer-wrap { padding:0 12px 4px; }
  #suggest { padding:0 12px; }
  .md { font-size:16px; }
  .bubble { max-width:88%; }
  .actions, .chat .icon-btn { opacity:1; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<aside id="side" aria-label="Chat history">
  <div class="side-top">
    <div class="brand"><div class="mark" data-logo></div>VedAI</div>
    <button class="icon-btn" id="closeSide" title="Close sidebar" aria-label="Close sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
    </button>
  </div>
  <button class="nav-btn" id="newChat">
    <span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
    New chat
  </button>
  <div class="label">Recents</div>
  <nav id="chats"></nav>
  <div class="side-foot"><b>Vedang Cellular Services</b>A Bluspring Enterprise</div>
</aside>
<div id="backdrop"></div>

<main class="empty">
  <header>
    <button class="icon-btn" id="openSide" title="Open sidebar" aria-label="Open sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
    </button>
    <div class="title">VedAI</div>
    <div class="spacer"></div>
    <button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle light or dark theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </header>

  <div id="scroll"><div id="thread" aria-live="polite"></div></div>

  <div id="hero">
    <div class="mark" data-logo></div>
    <h1 id="greet">How can I help you today?</h1>
    <p>Ask anything about Vedang Cellular Services</p>
  </div>

  <div class="composer-wrap">
    <form id="form">
      <textarea id="input" rows="1" placeholder="How can VedAI help you today?" aria-label="Message VedAI"></textarea>
      <div class="bar">
        <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8.5 5.5a5 5 0 0 1 7 0M6 3a8.5 8.5 0 0 1 12 0"/><path d="M12 10 7 21M12 10l5 11"/></svg>Vedang knowledge</span>
        <button id="send" type="submit" disabled aria-label="Send"></button>
      </div>
    </form>
  </div>

  <div id="suggest">
    <button type="button" data-q="What telecom services does Vedang Cellular offer?"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10 7 21M12 10l5 11M8.5 17h7"/><path d="M8.5 5.5a5 5 0 0 1 7 0M6 3a8.5 8.5 0 0 1 12 0"/></svg>Telecom services</button>
    <button type="button" data-q="What is DCRA and how does Vedang help with it?"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>DCRA ratings</button>
    <button type="button" data-q="Which telecom operators and companies does Vedang work with?"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>Our clients</button>
    <button type="button" data-q="How can I apply for a job at Vedang Cellular?"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>Careers</button>
  </div>

  <div class="disclaimer">VedAI can make mistakes. Please verify important details with Vedang Cellular Services.</div>
</main>

<script>
const $ = s => document.querySelector(s);
const main = $('main'), thread = $('#thread'), scroller = $('#scroll'), input = $('#input'), sendBtn = $('#send');
// Vedang mark: signal arcs over a tower "A" (uses currentColor so it follows the theme)
const LOGO = '<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 44 22 90h17l11-19 11 19h17z" fill="currentColor"/><path d="M37 39a18 18 0 0 1 26 0M28 30a31 31 0 0 1 44 0" stroke="currentColor" stroke-width="7" fill="none" stroke-linecap="round"/></svg>';
document.querySelectorAll('[data-logo]').forEach(el => el.innerHTML = LOGO);
const ICON = {
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
};
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

// Per-browser id so each visitor only sees their own chats.
const clientId = store.get('vedai-id') || crypto.randomUUID();
store.set('vedai-id', clientId);
const hdrs = { 'Content-Type': 'application/json', 'X-Client-Id': clientId };
const api = async (path, opts = {}) => (await fetch(path, { ...opts, headers: hdrs })).json();
DOMPurify.addHook('afterSanitizeAttributes', n => { if (n.tagName === 'A') { n.target = '_blank'; n.rel = 'noopener'; } });
const md = t => DOMPurify.sanitize(marked.parse(t));

let current = null, controller = null;
const isMobile = () => matchMedia('(max-width:768px)').matches;

// Time-of-day greeting
const h = new Date().getHours();
$('#greet').textContent = (h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening') + '. How can I help?';

/* ---------- theme & sidebar ---------- */
const savedTheme = store.get('vedai-theme');
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$('#theme').onclick = () => {
  const dark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  store.set('vedai-theme', document.documentElement.dataset.theme);
};
if (store.get('vedai-collapsed') === '1') document.body.classList.add('collapsed');
$('#openSide').onclick = () => {
  if (isMobile()) document.body.classList.add('open');
  else { document.body.classList.remove('collapsed'); store.set('vedai-collapsed', '0'); }
};
$('#closeSide').onclick = () => { document.body.classList.add('collapsed'); store.set('vedai-collapsed', '1'); };
$('#backdrop').onclick = () => document.body.classList.remove('open');

/* ---------- chat list ---------- */
async function loadChats() {
  const chats = await api('/api/chats');
  const nav = $('#chats');
  nav.innerHTML = chats.length ? '' : '<div class="empty-list">No conversations yet</div>';
  for (const c of chats) {
    const el = document.createElement('div');
    el.className = 'chat' + (c.id === current ? ' active' : '');
    el.innerHTML = `<span></span><button class="icon-btn" title="Delete chat" aria-label="Delete chat">${ICON.trash}</button>`;
    el.querySelector('span').textContent = c.title;
    el.onclick = () => openChat(c.id);
    el.querySelector('button').onclick = async e => {
      e.stopPropagation();
      if (!confirm(`Delete "${c.title}"?`)) return;
      await api('/api/chats/' + c.id, { method: 'DELETE' });
      if (current === c.id) newChat(); else loadChats();
    };
    nav.append(el);
  }
}

/* ---------- messages ---------- */
const nearBottom = () => scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120;
const toBottom = () => { scroller.scrollTop = scroller.scrollHeight; };

function addUser(text) {
  const row = document.createElement('div');
  row.className = 'row user';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.append(b);
  thread.append(row);
}

function addBot(text = '') {
  const row = document.createElement('div');
  row.className = 'row bot';
  row.innerHTML = `<div class="mark">${LOGO}</div><div class="body"><div class="md"></div>
    <div class="actions"><button class="icon-btn" title="Copy" aria-label="Copy answer">${ICON.copy}</button></div></div>`;
  const box = row.querySelector('.md');
  const copyBtn = row.querySelector('.actions button');
  copyBtn.onclick = async () => {
    try { await navigator.clipboard.writeText(row.dataset.raw || ''); } catch { return; }
    copyBtn.innerHTML = ICON.check;
    setTimeout(() => (copyBtn.innerHTML = ICON.copy), 1500);
  };
  thread.append(row);
  const set = t => { row.dataset.raw = t; box.innerHTML = md(t); };
  if (text) set(text);
  return { row, box, set };
}

function updateSend() {
  sendBtn.innerHTML = controller ? ICON.stop : ICON.up;
  sendBtn.setAttribute('aria-label', controller ? 'Stop generating' : 'Send');
  sendBtn.disabled = !controller && !input.value.trim();
}

function grow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 220) + 'px'; }

async function send(text) {
  text = text.trim();
  if (!text || controller) return;
  input.value = ''; grow();
  controller = new AbortController(); updateSend();
  let reply = '';
  let bot;
  try {
    if (!current) { current = (await api('/api/chats', { method: 'POST' })).id; thread.innerHTML = ''; }
    main.classList.remove('empty');
    addUser(text);
    bot = addBot();
    bot.row.classList.add('pending');
    bot.box.innerHTML = '<div class="thinking"><i></i>Thinking…</div>';
    toBottom();
    const r = await fetch(`/api/chats/${current}/messages`, {
      method: 'POST', headers: hdrs, body: JSON.stringify({ content: text }), signal: controller.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const reader = r.body.getReader(), dec = new TextDecoder();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      const stick = nearBottom();
      reply += dec.decode(value, { stream: true });
      bot.set(reply);
      if (stick) toBottom();
    }
  } catch (e) {
    if (e.name !== 'AbortError') reply += (reply ? '\n\n' : '') + '⚠️ Could not reach VedAI. Please try again.';
    if (bot) bot.set(reply || '_Stopped._');
  }
  if (bot) bot.row.classList.remove('pending');
  controller = null; updateSend(); input.focus();
  loadChats();
}

async function openChat(id) {
  if (controller) controller.abort();
  current = id;
  document.body.classList.remove('open');
  const msgs = await api('/api/chats/' + id);
  if (!Array.isArray(msgs)) return newChat();
  main.classList.remove('empty');
  thread.innerHTML = '';
  for (const m of msgs) m.role === 'user' ? addUser(m.content) : addBot(m.content);
  toBottom();
  loadChats();
}

function newChat() {
  if (controller) controller.abort();
  current = null;
  thread.innerHTML = '';
  main.classList.add('empty');
  document.body.classList.remove('open');
  input.focus();
  loadChats();
}

/* ---------- events ---------- */
$('#form').onsubmit = e => { e.preventDefault(); controller ? controller.abort() : send(input.value); };
input.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#form').requestSubmit(); } };
input.oninput = () => { grow(); updateSend(); };
$('#newChat').onclick = newChat;
for (const b of document.querySelectorAll('#suggest button')) b.onclick = () => send(b.dataset.q);

updateSend(); loadChats(); input.focus();
</script>
</body>
