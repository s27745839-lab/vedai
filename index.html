<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VedAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  --bg:#ffffff; --side:#f9f9f9; --surface:#f4f4f4; --hover:#ececec; --text:#0d0d0d; --muted:#6b6b6b;
  --border:#e5e5e5; --code:#f6f6f6; --shadow:0 4px 24px rgba(0,0,0,.06);
  --grad:linear-gradient(135deg,#5b3dff 0%,#9b5cff 100%);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#212121; --side:#171717; --surface:#303030; --hover:#2a2a2a; --text:#ececec; --muted:#a0a0a0;
    --border:#3a3a3a; --code:#0f0f0f; --shadow:0 4px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg:#212121; --side:#171717; --surface:#303030; --hover:#2a2a2a; --text:#ececec; --muted:#a0a0a0;
  --border:#3a3a3a; --code:#0f0f0f; --shadow:0 4px 24px rgba(0,0,0,.35);
}
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; display:flex; background:var(--bg); color:var(--text);
  font:15px/1.65 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
button { font:inherit; color:inherit; cursor:pointer; background:none; border:0; }
svg { width:20px; height:20px; flex:none; }
.icon-btn { width:36px; height:36px; display:grid; place-items:center; border-radius:8px; color:var(--muted); }
.icon-btn:hover { background:var(--hover); color:var(--text); }
:focus-visible { outline:2px solid #7b5cff; outline-offset:2px; }

/* Sidebar */
aside { width:260px; flex:none; background:var(--side); display:flex; flex-direction:column; padding:8px; transition:margin .25s ease; }
body.collapsed aside { margin-left:-260px; }
.side-top { display:flex; align-items:center; justify-content:space-between; padding:4px 4px 8px; }
.brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px; letter-spacing:.2px; }
.logo { width:28px; height:28px; border-radius:50%; background:var(--grad); color:#fff; display:grid; place-items:center;
  font-weight:700; font-size:14px; flex:none; box-shadow:0 2px 8px rgba(91,61,255,.35); }
.nav-btn { display:flex; align-items:center; gap:10px; width:100%; padding:9px 10px; border-radius:10px; font-weight:500; text-align:left; }
.nav-btn:hover { background:var(--hover); }
.label { font-size:12px; color:var(--muted); font-weight:600; padding:18px 10px 6px; }
#chats { flex:1; overflow-y:auto; margin:0 -4px; padding:0 4px; }
.chat { display:flex; align-items:center; border-radius:10px; padding:0 4px 0 10px; height:38px; cursor:pointer; }
.chat:hover, .chat.active { background:var(--hover); }
.chat span { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:14px; }
.chat .icon-btn { width:28px; height:28px; opacity:0; }
.chat:hover .icon-btn, .chat.active .icon-btn { opacity:1; }
.chat .icon-btn svg { width:16px; height:16px; }
.side-foot { border-top:1px solid var(--border); padding:12px 8px 4px; font-size:12px; color:var(--muted); line-height:1.4; }
.side-foot b { color:var(--text); font-weight:600; display:block; font-size:13px; }

/* Main */
main { flex:1; min-width:0; display:flex; flex-direction:column; position:relative; }
header { height:56px; flex:none; display:flex; align-items:center; gap:4px; padding:0 12px; }
header .title { font-weight:600; font-size:17px; padding:0 8px; display:flex; align-items:center; gap:6px; }
header .title small { color:var(--muted); font-weight:500; font-size:14px; }
#openSide { display:none; }
body.collapsed #openSide { display:grid; }
header .spacer { flex:1; }
#scroll { flex:1; overflow-y:auto; }
#thread { max-width:768px; margin:0 auto; padding:16px 24px 32px; }

.row { margin:0 0 28px; animation:in .25s ease; }
@keyframes in { from { opacity:0; transform:translateY(6px); } }
.row.user { display:flex; justify-content:flex-end; }
.bubble { background:var(--surface); border-radius:22px; padding:10px 18px; max-width:75%; white-space:pre-wrap; overflow-wrap:anywhere; }
.row.bot { display:flex; gap:14px; }
.row.bot .logo { margin-top:2px; }
.row.bot .body { flex:1; min-width:0; }
.actions { display:flex; gap:2px; margin-top:4px; margin-left:-8px; opacity:0; transition:opacity .15s; }
.row.bot:hover .actions, .row.bot:last-child .actions { opacity:1; }
.row.pending .actions { display:none; }
.actions .icon-btn { width:32px; height:32px; }
.actions svg { width:17px; height:17px; }

/* Markdown */
.md > :first-child { margin-top:0; }
.md > :last-child { margin-bottom:0; }
.md p, .md ul, .md ol { margin:0 0 14px; }
.md ul, .md ol { padding-left:22px; }
.md li { margin:4px 0; }
.md h1, .md h2, .md h3 { line-height:1.3; margin:22px 0 10px; font-weight:600; }
.md h1 { font-size:22px; } .md h2 { font-size:19px; } .md h3 { font-size:16px; }
.md a { color:#7b5cff; text-decoration:none; } .md a:hover { text-decoration:underline; }
.md strong { font-weight:600; }
.md code { font:13.5px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; background:var(--surface); padding:2px 6px; border-radius:6px; }
.md pre { background:var(--code); border:1px solid var(--border); border-radius:12px; padding:14px 16px; overflow-x:auto; margin:0 0 14px; }
.md pre code { background:none; padding:0; }
.md table { border-collapse:collapse; margin:0 0 14px; display:block; overflow-x:auto; }
.md th, .md td { border:1px solid var(--border); padding:8px 12px; text-align:left; }
.md th { background:var(--surface); font-weight:600; }
.md blockquote { margin:0 0 14px; padding-left:14px; border-left:3px solid var(--border); color:var(--muted); }
.md hr { border:0; border-top:1px solid var(--border); margin:20px 0; }
.dots { display:flex; gap:5px; padding:10px 0; }
.dots span { width:8px; height:8px; border-radius:50%; background:var(--muted); animation:pulse 1.2s infinite ease-in-out; }
.dots span:nth-child(2) { animation-delay:.15s; } .dots span:nth-child(3) { animation-delay:.3s; }
@keyframes pulse { 0%,80%,100% { opacity:.25; transform:scale(.8); } 40% { opacity:1; transform:scale(1); } }

/* Hero (empty state) */
#hero { display:none; text-align:center; padding:0 24px 28px; }
#hero .logo { width:52px; height:52px; font-size:24px; margin:0 auto 18px; }
#hero h1 { font-size:28px; font-weight:600; margin:0; letter-spacing:-.3px; }
#hero p { color:var(--muted); margin:6px 0 0; }
main.empty { justify-content:center; }
main.empty header { position:absolute; top:0; left:0; right:0; }
main.empty #scroll { display:none; }
main.empty #hero, main.empty #suggest { display:grid; }

/* Composer */
.composer-wrap { padding:0 24px 8px; flex:none; }
form { max-width:768px; margin:0 auto; background:var(--surface); border-radius:28px; padding:10px 10px 10px 22px;
  display:flex; align-items:flex-end; gap:8px; box-shadow:var(--shadow); border:1px solid var(--border); }
textarea { flex:1; resize:none; border:0; outline:0; background:none; color:var(--text); font:inherit; line-height:1.5;
  padding:7px 0; max-height:220px; }
textarea::placeholder { color:var(--muted); }
textarea:focus-visible { outline:none; }
form:focus-within { border-color:#7b5cff80; }
#send { width:38px; height:38px; border-radius:50%; background:var(--text); color:var(--bg); display:grid; place-items:center; transition:opacity .15s, transform .1s; }
#send:active { transform:scale(.94); }
#send:disabled { opacity:.25; cursor:default; }
#send svg { width:18px; height:18px; }
#suggest { display:none; width:100%; max-width:816px; margin:14px auto 0; grid-template-columns:1fr 1fr; gap:10px; padding:0 24px; }
#suggest button { text-align:left; border:1px solid var(--border); border-radius:16px; padding:12px 16px; line-height:1.4; transition:background .15s; }
#suggest button:hover { background:var(--hover); }
#suggest b { display:block; font-weight:600; font-size:14px; }
#suggest span { color:var(--muted); font-size:13.5px; }
.disclaimer { text-align:center; font-size:12px; color:var(--muted); padding:8px 16px 14px; }
main.empty .disclaimer { position:absolute; bottom:0; left:0; right:0; }

#backdrop { display:none; }
@media (max-width:768px) {
  aside { position:fixed; inset:0 auto 0 0; z-index:20; margin-left:-260px; box-shadow:var(--shadow); }
  body.open aside { margin-left:0; }
  body.open #backdrop { display:block; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:15; }
  #openSide { display:grid !important; }
  #closeSide { display:none; }
  #thread { padding:8px 16px 24px; }
  .composer-wrap { padding:0 12px 4px; }
  #suggest { grid-template-columns:1fr; padding:0 12px; }
  #suggest button:nth-child(n+3) { display:none; }
  #hero h1 { font-size:23px; }
  .bubble { max-width:88%; }
  .actions, .chat .icon-btn { opacity:1; }
}
</style>
</head>
<body>
<aside id="side" aria-label="Chat history">
  <div class="side-top">
    <div class="brand"><div class="logo">V</div>VedAI</div>
    <button class="icon-btn" id="closeSide" title="Close sidebar" aria-label="Close sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
    </button>
  </div>
  <button class="nav-btn" id="newChat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    New chat
  </button>
  <div class="label">Recent</div>
  <nav id="chats"></nav>
  <div class="side-foot"><b>Vedang Cellular Services</b>A Bluspring Enterprise</div>
</aside>
<div id="backdrop"></div>

<main class="empty">
  <header>
    <button class="icon-btn" id="openSide" title="Open sidebar" aria-label="Open sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
    </button>
    <div class="title">VedAI <small>by Vedang Cellular</small></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle light or dark theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div id="scroll"><div id="thread" aria-live="polite"></div></div>

  <div id="hero">
    <div class="logo">V</div>
    <h1>How can I help you today?</h1>
    <p>Ask anything about Vedang Cellular Services</p>
  </div>

  <div class="composer-wrap">
    <form id="form">
      <textarea id="input" rows="1" placeholder="Message VedAI" aria-label="Message VedAI"></textarea>
      <button id="send" type="submit" disabled aria-label="Send"></button>
    </form>
  </div>

  <div id="suggest">
    <button type="button" data-q="What services does Vedang Cellular offer?"><b>Our services</b><span>What does Vedang Cellular do?</span></button>
    <button type="button" data-q="What is DCRA and how does Vedang help with it?"><b>DCRA ratings</b><span>Explain digital connectivity rating</span></button>
    <button type="button" data-q="Which telecom operators and companies does Vedang work with?"><b>Our clients</b><span>Who do we work with?</span></button>
    <button type="button" data-q="How can I apply for a job at Vedang Cellular?"><b>Careers</b><span>How can I join the team?</span></button>
  </div>

  <div class="disclaimer">VedAI can make mistakes. Check important info with Vedang Cellular.</div>
</main>

<script>
const $ = s => document.querySelector(s);
const main = $('main'), thread = $('#thread'), scroller = $('#scroll'), input = $('#input'), sendBtn = $('#send');
const ICON = {
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
};
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

// Per-browser id so each visitor only sees their own chats.
const clientId = store.get('vedai-id') || crypto.randomUUID();
store.set('vedai-id', clientId);
const hdrs = { 'Content-Type': 'application/json', 'X-Client-Id': clientId };
const api = async (path, opts = {}) => (await fetch(path, { ...opts, headers: hdrs })).json();
const md = t => DOMPurify.sanitize(marked.parse(t));

let current = null, controller = null;
const isMobile = () => matchMedia('(max-width:768px)').matches;

/* ---------- theme & sidebar ---------- */
const savedTheme = store.get('vedai-theme');
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$('#theme').onclick = () => {
  const dark = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() === '#212121';
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  store.set('vedai-theme', document.documentElement.dataset.theme);
};
if (store.get('vedai-collapsed') === '1') document.body.classList.add('collapsed');
$('#openSide').onclick = () => {
  if (isMobile()) document.body.classList.add('open');
  else { document.body.classList.remove('collapsed'); store.set('vedai-collapsed', '0'); }
};
$('#closeSide').onclick = () => { document.body.classList.add('collapsed'); store.set('vedai-collapsed', '1'); };
$('#backdrop').onclick = () => document.body.classList.remove('open');

/* ---------- chat list ---------- */
async function loadChats() {
  const chats = await api('/api/chats');
  const nav = $('#chats');
  nav.innerHTML = '';
  for (const c of chats) {
    const el = document.createElement('div');
    el.className = 'chat' + (c.id === current ? ' active' : '');
    el.innerHTML = `<span></span><button class="icon-btn" title="Delete chat" aria-label="Delete chat">${ICON.trash}</button>`;
    el.querySelector('span').textContent = c.title;
    el.onclick = () => openChat(c.id);
    el.querySelector('button').onclick = async e => {
      e.stopPropagation();
      if (!confirm(`Delete "${c.title}"?`)) return;
      await api('/api/chats/' + c.id, { method: 'DELETE' });
      if (current === c.id) newChat(); else loadChats();
    };
    nav.append(el);
  }
}

/* ---------- messages ---------- */
const nearBottom = () => scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120;
const toBottom = () => { scroller.scrollTop = scroller.scrollHeight; };

function addUser(text) {
  const row = document.createElement('div');
  row.className = 'row user';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.append(b);
  thread.append(row);
}

function addBot(text = '') {
  const row = document.createElement('div');
  row.className = 'row bot';
  row.innerHTML = `<div class="logo">V</div><div class="body"><div class="md"></div>
    <div class="actions"><button class="icon-btn" title="Copy" aria-label="Copy answer">${ICON.copy}</button></div></div>`;
  const box = row.querySelector('.md');
  const copyBtn = row.querySelector('.actions button');
  copyBtn.onclick = async () => {
    try { await navigator.clipboard.writeText(row.dataset.raw || ''); } catch { return; }
    copyBtn.innerHTML = ICON.check;
    setTimeout(() => (copyBtn.innerHTML = ICON.copy), 1500);
  };
  thread.append(row);
  const set = t => { row.dataset.raw = t; box.innerHTML = md(t); };
  if (text) set(text);
  return { row, box, set };
}

function updateSend() {
  sendBtn.innerHTML = controller ? ICON.stop : ICON.up;
  sendBtn.setAttribute('aria-label', controller ? 'Stop generating' : 'Send');
  sendBtn.disabled = !controller && !input.value.trim();
}

function grow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 220) + 'px'; }

async function send(text) {
  text = text.trim();
  if (!text || controller) return;
  input.value = ''; grow();
  controller = new AbortController(); updateSend();
  let reply = '';
  let bot;
  try {
    if (!current) { current = (await api('/api/chats', { method: 'POST' })).id; thread.innerHTML = ''; }
    main.classList.remove('empty');
    addUser(text);
    bot = addBot();
    bot.row.classList.add('pending');
    bot.box.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
    toBottom();
    const r = await fetch(`/api/chats/${current}/messages`, {
      method: 'POST', headers: hdrs, body: JSON.stringify({ content: text }), signal: controller.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const reader = r.body.getReader(), dec = new TextDecoder();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      const stick = nearBottom();
      reply += dec.decode(value, { stream: true });
      bot.set(reply);
      if (stick) toBottom();
    }
  } catch (e) {
    if (e.name !== 'AbortError') reply += (reply ? '\n\n' : '') + '⚠️ Could not reach VedAI. Please try again.';
    if (bot) bot.set(reply || '_Stopped._');
  }
  if (bot) bot.row.classList.remove('pending');
  controller = null; updateSend(); input.focus();
  loadChats();
}

async function openChat(id) {
  if (controller) controller.abort();
  current = id;
  document.body.classList.remove('open');
  const msgs = await api('/api/chats/' + id);
  if (!Array.isArray(msgs)) return newChat();
  main.classList.remove('empty');
  thread.innerHTML = '';
  for (const m of msgs) m.role === 'user' ? addUser(m.content) : addBot(m.content);
  toBottom();
  loadChats();
}

function newChat() {
  if (controller) controller.abort();
  current = null;
  thread.innerHTML = '';
  main.classList.add('empty');
  document.body.classList.remove('open');
  input.focus();
  loadChats();
}

/* ---------- events ---------- */
$('#form').onsubmit = e => { e.preventDefault(); controller ? controller.abort() : send(input.value); };
input.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#form').requestSubmit(); } };
input.oninput = () => { grow(); updateSend(); };
$('#newChat').onclick = newChat;
for (const b of document.querySelectorAll('#suggest button')) b.onclick = () => send(b.dataset.q);
DOMPurify.addHook('afterSanitizeAttributes', n => { if (n.tagName === 'A') { n.target = '_blank'; n.rel = 'noopener'; } });

updateSend(); loadChats(); input.focus();
</script>
</body>
</html>
